plugins {
    id 'java'
}

group = 'com.wiley'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    implementation 'org.seleniumhq.selenium:selenium-java:4.32.0'

    implementation 'io.github.bonigarcia:webdrivermanager:5.9.2'

    implementation 'com.aventstack:extentreports:5.1.1'

    testImplementation 'org.testng:testng:7.10.2'
}

test {
    useTestNG() {
        def suiteFile = System.getProperty("suiteXmlFile")

        if (suiteFile != null) {
            suites suiteFile
        }
    }
}